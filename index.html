<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué grado de espía es usted?</title>
<meta name="description" content="Cinco preguntas para descubrir qué grado de espía es usted.">
<meta property="og:title" content="¿Qué grado de espía es usted?">
<meta property="og:description" content="Cinco preguntas para descubrir qué grado de espía es usted.">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#e8ecf0; --card:#ffffff; --ink:#111b26; --muted:#56636f; --line:#c9d1d9;
  --accent:#b3261e; --accent-ink:#ffffff; --pick:#fbeceb;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e161e; --card:#17222d; --ink:#e7ecf1; --muted:#9aa8b5; --line:#2c3b49;
    --accent:#ff7468; --accent-ink:#1a0b09; --pick:#2b1f22;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;padding:28px 16px 40px}
main{width:100%;max-width:640px}
h1{font-size:clamp(28px,6vw,38px);line-height:1.15;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 22px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-size:20px;line-height:1.35;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:transparent;
  border:1.5px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--pick)}
.letter{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;
  display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:1px}
.opt.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stamp{display:inline-block;font-size:clamp(22px,5.5vw,30px);line-height:1.15;font-weight:700;
  color:var(--accent);border:3px solid var(--accent);border-radius:6px;padding:8px 14px;
  transform:rotate(-2deg);margin:4px 0 18px}
.score{color:var(--muted);margin:0 0 14px;font-size:15px}
.text{margin:0 0 22px;max-width:60ch}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:8px;padding:12px 20px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:15px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i,.opt{transition:none}}
</style>
</head>
<body>
<main>
  <h1>¿Qué grado de espía es usted?</h1>
  <p class="sub">Cinco preguntas. Responda con sinceridad: aquí nadie lo está vigilando (o eso creemos).</p>

  <section class="card" id="quiz" aria-live="polite">
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <p class="count" id="count"></p>
    <h2 id="q"></h2>
    <ul class="opts" id="opts"></ul>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <div class="stamp" id="level"></div>
    <p class="score" id="score"></p>
    <p class="text" id="text"></p>
    <button class="btn" id="again" type="button">Hacer el test de nuevo</button>
  </section>

  <a class="back" href="../">Ver más tests</a>
</main>

<script>
/* ============================================================
   TEXTOS DEL TEST: aquí puede editar preguntas, respuestas y
   resultados. Respete las comillas " " y las comas al final
   de cada elemento.
   Las respuestas van en orden: la primera vale 1 punto (A),
   la segunda 2 puntos (B) y la tercera 3 puntos (C).
   ============================================================ */
var QUESTIONS = [
  { q: "En su localidad, en su barrio, en su comunidad, ¿qué tanto conoce a sus vecinos?",
    a: [
      "La verdad es que solo sabe quién es el que se estaciona enfrente de su puerta, el departamento en el que hacen las fiestas, pero nada más.",
      "Tiene cercanía con varios, a otros los conoce de nombre (Miguelón, Irmita) y a unos más solo de apodos (el Pachicleta, la Chupitos).",
      "Sabe nombres y apellidos, las profesiones de varios y quién está enemistado con quién. Sabe cómo están los duelos de poder y los antecedentes penales de cada quien."
    ] },
  { q: "Está en la puerta de su casa después de un día largo y se da cuenta de que no tiene la llave. No tiene quién le abra: nadie tiene repuesto, no hay portero. ¿Qué hace?",
    a: [
      "Ni modo, hace coraje y busca un cerrajero de 24 horas y desembolsa los 2,500 pesos que le va a cobrar por cinco minutos de trabajo.",
      "Ni modo, hace coraje e intenta destrabar el seguro de una ventana con un alambre. Quizá lo logre, quizá duerma en el auto.",
      "Ni modo, hace coraje, y logra que el vecino le llame a su primo que sabe de cerrajería y en dos horas está usted en su casa."
    ] },
  { q: "Le están contando una anécdota en una comida, pero la anécdota incluye material fotográfico. «Mira, checa esto», le dicen, y le pasan un teléfono para enriquecer la anécdota. Entonces usted:",
    a: [
      "Acerca la cabeza, asoma la mirada, sin tocar el dispositivo ajeno.",
      "Toma el dispositivo, pide permiso para hacer zoom.",
      "No han terminado de sacar el teléfono cuando ya está en su poder, recorre el carrete tanto a la izquierda como a la derecha y, en una de esas, hasta abre alguna app para buscar algo más."
    ] },
  { q: "Tiene que salir de viaje, ¿con cuántos dispositivos digitales viaja?",
    a: [
      "Con uno, el teléfono, máximo dos.",
      "Con por lo menos tres: el teléfono, el otro teléfono, la computadora.",
      "Uy no, viaja una maleta solo para mis dispositivos. Si pudiera, les compraba boleto propio."
    ] },
  { q: "Esta pregunta final es algo personal, pero aquí va… Sabemos que las páginas piden una cantidad mínima de caracteres, con algún número y símbolo para las contraseñas de sus correos y cuentas. Sabiendo eso, usted…",
    a: [
      "En todos o casi todos usa la misma, y es alguna palabra o frase significativa, un refrán o el nombre del grupo de rock que tuvo en su adolescencia.",
      "Tengo varias, y uso una muy buena sopa de letras, números y símbolos para cada una.",
      "Yo uso una aplicación de generación aleatoria de contraseñas y un encriptador, al mismo tiempo que tengo reconocimiento facial y dactilar como verificación."
    ] }
];

/* RESULTADOS: "max" es el puntaje máximo que corresponde a cada uno.
   Con 5 preguntas el total va de 5 a 15:
   hasta 8 = primer resultado, de 9 a 11 = segundo, de 12 a 15 = tercero. */
var RESULTS = [
  { max: 8, level: "Aprendiz de espía",
    text: "Usted cree que es un espía, pero en realidad es lo que se conoce como un chismoso. Con todo respeto, obviamente. O mejor dicho: su nivel es aprendiz de espía. Le recomendamos que se aficione a la literatura de espías o, de perdida, a una serie de televisión de las que abundan; ahí seguramente tendrá bastante inspiración para profundizar en su desarrollo." },
  { max: 11, level: "Espía de la vieja escuela",
    text: "Usted es un egresado de la escuela más clásica del espionaje. Estudió con el profesor de Sherlock Holmes, usted le habla de tú a M. Sabe de zapatófonos, su atuendo favorito es la gabardina, su herramienta predilecta es la deducción. Conoce las técnicas clásicas y, si algo se le puede echar en cara, es más bien que se apega demasiado a ellas." },
  { max: 15, level: "Agencia estatal de espionaje",
    text: "Usted es… ni siquiera tengo que decírselo porque usted ya lo sabe. Su nivel de espionaje es equivalente al de una agencia estatal; qué digo agencia, usted le enseñó a relinchar y volar a Pegasus. La recomendación es más bien que le baje, que tampoco es para tanto: no hay necesidad de que se convierta usted en el inspector Gadget a diario." }
];

/* ===== A partir de aquí no hace falta tocar nada ===== */
var LETTERS = ["A", "B", "C"];
var current = 0, points = [];
var $ = function (id) { return document.getElementById(id); };

function show() {
  var item = QUESTIONS[current];
  $("count").textContent = "Pregunta " + (current + 1) + " de " + QUESTIONS.length;
  $("fill").style.width = (current / QUESTIONS.length * 100) + "%";
  $("q").textContent = item.q;
  var list = $("opts");
  list.innerHTML = "";
  item.a.forEach(function (txt, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    var l = document.createElement("span");
    l.className = "letter";
    l.textContent = LETTERS[i];
    var s = document.createElement("span");
    s.textContent = txt;
    b.appendChild(l);
    b.appendChild(s);
    b.addEventListener("click", function () { choose(b, i + 1); });
    li.appendChild(b);
    list.appendChild(li);
  });
}

function choose(btn, value) {
  var all = document.querySelectorAll(".opt");
  for (var i = 0; i < all.length; i++) { all[i].disabled = true; }
  btn.classList.add("sel");
  points.push(value);
  setTimeout(function () {
    current++;
    if (current < QUESTIONS.length) { show(); } else { finish(); }
  }, 350);
}

function finish() {
  var total = points.reduce(function (a, b) { return a + b; }, 0);
  var res = RESULTS.filter(function (r) { return total <= r.max; })[0];
  $("fill").style.width = "100%";
  $("quiz").hidden = true;
  $("level").textContent = res.level;
  $("score").textContent = "Sumó " + total + " puntos de " + (QUESTIONS.length * 3) + ".";
  $("text").textContent = res.text;
  $("result").hidden = false;
  window.scrollTo(0, 0);
}

$("again").addEventListener("click", function () {
  current = 0; points = [];
  $("result").hidden = true;
  $("quiz").hidden = false;
  show();
});

show();
</script>
</body>
</html>
