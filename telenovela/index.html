<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué tipo de telenovela mexicana es usted?</title>
<meta name="description" content="Cinco preguntas para descubrir qué tipo de telenovela mexicana es usted.">
<meta property="og:title" content="¿Qué tipo de telenovela mexicana es usted?">
<meta property="og:description" content="Cinco preguntas para descubrir qué tipo de telenovela mexicana es usted.">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#e8ecf0; --card:#ffffff; --ink:#111b26; --muted:#56636f; --line:#c9d1d9;
  --accent:#b3261e; --accent-ink:#ffffff; --pick:#fbeceb;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e161e; --card:#17222d; --ink:#e7ecf1; --muted:#9aa8b5; --line:#2c3b49;
    --accent:#ff7468; --accent-ink:#1a0b09; --pick:#2b1f22;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;padding:28px 16px 40px}
main{width:100%;max-width:640px}
h1{font-size:clamp(28px,6vw,38px);line-height:1.15;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 22px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-size:20px;line-height:1.35;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:transparent;
  border:1.5px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--pick)}
.letter{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;
  display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:1px}
.opt.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stamp{display:inline-block;font-size:clamp(22px,5.5vw,30px);line-height:1.15;font-weight:700;
  color:var(--accent);border:3px solid var(--accent);border-radius:6px;padding:8px 14px;
  transform:rotate(-2deg);margin:4px 0 18px}
.score{color:var(--muted);margin:0 0 14px;font-size:15px}
.text{margin:0 0 22px;max-width:60ch}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:8px;padding:12px 20px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:15px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i,.opt{transition:none}}
</style>
</head>
<body>
<main>
  <h1>¿Qué tipo de telenovela mexicana es usted?</h1>
  <p class="sub">Cinco preguntas para descubrir qué clase de dramón habita en su interior.</p>

  <section class="card" id="quiz" aria-live="polite">
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <p class="count" id="count"></p>
    <h2 id="q"></h2>
    <ul class="opts" id="opts"></ul>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <div class="stamp" id="level"></div>
    <p class="score" id="score"></p>
    <p class="text" id="text"></p>
    <button class="btn" id="again" type="button">Hacer el test de nuevo</button>
  </section>

  <a class="back" href="../">Ver más tests</a>
</main>
<script data-goatcounter="https://elotroduarte.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
/* ============================================================
   TEXTOS DEL TEST: aquí puede editar preguntas, respuestas y
   resultados. Respete las comillas " " y las comas al final
   de cada elemento.
   Las respuestas van en orden: la primera vale 1 punto (A),
   la segunda 2 puntos (B) y la tercera 3 puntos (C).
   ============================================================ */
var QUESTIONS = [
  { q: "Hay una crisis en su vida. Un momento de esos en los que todo parece oscuro. Hay que hacer algo para cambiar las vibras, para romper el ritmo, para renovar las energías. ¿Qué suele hacer?",
    a: [
      "Un makeover, una buena compra de accesorios, un corte de pelo, arreglarse la barba.",
      "La tradicional lloradita y a seguir, quizá una llamada a su amiga o su amigo.",
      "No se va a andar con chiquitas: un viaje, una renuncia, romper relaciones personales o institucionales."
    ] },
  { q: "No tiene que nombrarlo o nombrarla, faltaba más, pero ¿quién suele ser su némesis? Porque hasta para los rivales tenemos nuestro tipo:",
    a: [
      "El compañero de escuela, el amigo de infancia, la integrante del grupo social que no sabe bien de quién es amiga.",
      "La suegra, el cuñado, algún familiar político.",
      "Usted es de los que se enemistan con políticos, que no suelta a alguna figura pública, o a un empresario."
    ] },
  { q: "Cuando usted habla de éxito, de la palabra éxito personal. Dígala. En silencio si quiere. Dígala una vez más: ¿qué es lo que se imagina, qué aparece ante su mente?",
    a: [
      "Viralidad, muchos seguidores, ser reconocido o reconocida en la calle.",
      "Dinero, viajes, casota, quizá alguna portada, pero de revista impresa de sociales.",
      "Altos círculos de poder, edificios, reuniones con los que mueven al mundo. CEO cósmico."
    ] },
  { q: "Esto es ficción, es imaginación, un ejercicio de imaginación. Pero supongaaaaamos que usted es villano tremendo, usted es mala de malolandia. ¿Cuál sería su método preferido para despachar a sus rivales?",
    a: [
      "El juego mental, la maledicencia, las psy ops.",
      "Los métodos clásicos: la copita envenenada, la pastillita en el desayuno.",
      "La modestia es para otros: coche bomba, incendio que parece accidente, esas cosas."
    ] },
  { q: "Se dice que somos los protagonistas de nuestra vida. Los personajes centrales y los demás son secundarios, extras. Entonces, si usted pudiera elegir, ¿cuál de estos recursos fílmicos le gustaría que aparecieran en la trama de su vida?",
    a: [
      "La súbita coreografía a media calle. Va usted al mercado y de pronto una canción suena en los altavoces y todos, locatarios, compradores y marchantes, comienzan a cantar y bailar en perfecta sincronía.",
      "La famosísima voz en off con cambio de velocidad en el video. Ante las encrucijadas, de pronto se escucha una voz estilo Morgan Freeman o Verónica Castro, que narra lo que usted está pensando y sintiendo.",
      "El inigualable flashback. Blanco y negro repentino y viajamos a Guayaquil, 1946: usted de joven haciendo travesuras que explican mucho de lo que le pasa."
    ] }
];

/* RESULTADOS: "max" es el puntaje máximo que corresponde a cada uno.
   Con 5 preguntas el total va de 5 a 15:
   hasta 8 = primer resultado, de 9 a 11 = segundo, de 12 a 15 = tercero. */
var RESULTS = [
  { max: 8, level: "Telenovela juvenil",
    text: "Usted es la exitosísima telenovela juvenil. Porque usted sabe que la vida nunca deja de ser un patio de secundaria. Esas sí son luchas de poder, traiciones inesperadas y pasiones intensísimas que duran lo que una campana de recreo. Nomás mucho cuidado con ser de esos actores y actrices que, entrados los cuarenta, siguen interpretando colegiales de 16." },
  { max: 11, level: "La saga quintaesencial",
    text: "Usted es la saga quintaesencial: un héroe, una heroína sola contra el mundo; una villana cruel y sagaz, atemorizante y hábil para la agresión verbal. Lo suyo es el drama íntimo pero fogoso, el azote que grita por besar a la lisiada, la caída por las escaleras, y la conquista romántica como variante del ascenso social." },
  { max: 15, level: "Gran producción de época",
    text: "Usted es una de las grandes producciones de época. Un viaje al Japón antiguo, una telenovela de piratas o un dramón de insurgentes o revolucionarios. Lo suyo no es la sufridera humilde o callada, nada: lo suyo es el esplendor del dramón con 100 extras en escena, miles y miles de capítulos y paralelos con nuestra historia." }
];

/* ===== A partir de aquí no hace falta tocar nada ===== */
var LETTERS = ["A", "B", "C"];
var current = 0, points = [];
var $ = function (id) { return document.getElementById(id); };

function show() {
  var item = QUESTIONS[current];
  $("count").textContent = "Pregunta " + (current + 1) + " de " + QUESTIONS.length;
  $("fill").style.width = (current / QUESTIONS.length * 100) + "%";
  $("q").textContent = item.q;
  var list = $("opts");
  list.innerHTML = "";
  item.a.forEach(function (txt, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    var l = document.createElement("span");
    l.className = "letter";
    l.textContent = LETTERS[i];
    var s = document.createElement("span");
    s.textContent = txt;
    b.appendChild(l);
    b.appendChild(s);
    b.addEventListener("click", function () { choose(b, i + 1); });
    li.appendChild(b);
    list.appendChild(li);
  });
}

function choose(btn, value) {
  var all = document.querySelectorAll(".opt");
  for (var i = 0; i < all.length; i++) { all[i].disabled = true; }
  btn.classList.add("sel");
  points.push(value);
  setTimeout(function () {
    current++;
    if (current < QUESTIONS.length) { show(); } else { finish(); }
  }, 350);
}

function finish() {
  var total = points.reduce(function (a, b) { return a + b; }, 0);
  var res = RESULTS.filter(function (r) { return total <= r.max; })[0];
  $("fill").style.width = "100%";
  $("quiz").hidden = true;
  $("level").textContent = res.level;
  $("score").textContent = "Sumó " + total + " puntos de " + (QUESTIONS.length * 3) + ".";
  $("text").textContent = res.text;
  $("result").hidden = false;
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path: "telenovela-completado", title: "Test telenovela completado", event: true });
  }
  window.scrollTo(0, 0);
}

$("again").addEventListener("click", function () {
  current = 0; points = [];
  $("result").hidden = true;
  $("quiz").hidden = false;
  show();
});

show();
</script>
</body>
</html>
