<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿De qué forma regresará del más allá para asustar a los vivos?</title>
<meta name="description" content="Cinco preguntas para descubrir en qué criatura se convertirá cuando regrese del más allá.">
<meta property="og:title" content="¿De qué forma regresará del más allá para asustar a los vivos?">
<meta property="og:description" content="Cinco preguntas para descubrir en qué criatura se convertirá cuando regrese del más allá.">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#e8ecf0; --card:#ffffff; --ink:#111b26; --muted:#56636f; --line:#c9d1d9;
  --accent:#b3261e; --accent-ink:#ffffff; --pick:#fbeceb;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e161e; --card:#17222d; --ink:#e7ecf1; --muted:#9aa8b5; --line:#2c3b49;
    --accent:#ff7468; --accent-ink:#1a0b09; --pick:#2b1f22;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;padding:28px 16px 40px}
main{width:100%;max-width:640px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.2;font-weight:700;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 22px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-size:20px;line-height:1.35;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:transparent;
  border:1.5px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--pick)}
.letter{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;
  display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:1px}
.opt.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stamp{display:inline-block;font-size:clamp(22px,5.5vw,30px);line-height:1.15;font-weight:700;
  color:var(--accent);border:3px solid var(--accent);border-radius:6px;padding:8px 14px;
  transform:rotate(-2deg);margin:4px 0 18px}
.score{color:var(--muted);margin:0 0 14px;font-size:15px}
.text{margin:0 0 22px;max-width:60ch}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:8px;padding:12px 20px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.back{display:inline-block;margin-top:20px;color:var(--muted);font-size:15px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i,.opt{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Cuando desafortunadamente deje este plano existencial, ¿de qué forma regresará del más allá para asustar a los vivos?</h1>
  <p class="sub">Cinco preguntas para descubrir en qué monstruo se convertirá.</p>

  <section class="card" id="quiz" aria-live="polite">
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <p class="count" id="count"></p>
    <h2 id="q"></h2>
    <ul class="opts" id="opts"></ul>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <div class="stamp" id="level"></div>
    <p class="score" id="score"></p>
    <p class="text" id="text"></p>
    <button class="btn" id="again" type="button">Hacer el test de nuevo</button>
  </section>

  <a class="back" href="../">Ver más tests</a>
</main>

  <script data-goatcounter="https://elotroduarte.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<script>
/* ============================================================
   TEXTOS DEL TEST: aquí puede editar preguntas, respuestas y
   resultados. Respete las comillas " " y las comas al final
   de cada elemento.
   Las respuestas van en orden: la primera vale 1 punto (A),
   la segunda 2 puntos (B) y la tercera 3 puntos (C).
   ============================================================ */
var QUESTIONS = [
  { q: "A lo largo del día uno se enfrenta a situaciones inexplicables y motivos de superstición: una escalera en su camino, un espejo que se quiebra. ¿Cuál es su reacción ante estos momentos?",
    a: [
      "Me valen, paso por abajo de las escaleras con confianza. La superstición es para los débiles.",
      "Muchas de estas cosas no me provocan nada. Pero alguna que otra, sí, me cuadro ante la magia.",
      "Pero por supuesto que me atengo a todas las leyes de la magia, porque no es superstición: es algo real, sucede, y más vale echarse sal por encima del hombro."
    ] },
  { q: "Planea usted unas vacaciones grupales a una linda cabaña en la montaña. Viaja para allá y llega de noche. Se instala y comienzan a suceder cosas extrañas: ruidos, objetos que se mueven, etc. Usted:",
    a: [
      "Les dice a todos que no sean mensos, que se duerman, que nomás cierren bien las ventanas porque seguro hay mapaches.",
      "Se preocupa bastante, no duerme y hace las paces con sus dioses. Porque… ¿y si sí? ¿Y si se trata de un ente insepulto con venganza en el alma, una fuerza del más allá?",
      "Nombre, saca crucifijo, ouija, sal gruesa, pide que le consigan una gallina negra o unas lágrimas de doncella para comenzar un duelo contra el maligno."
    ] },
  { q: "De estos géneros, ¿cuáles son las pesadillas que se le aparecen con más frecuencia?",
    a: [
      "Persecuciones, caídas, quedar atrapado en algún sitio, etc.",
      "Alteraciones corporales, dientes que se caen, ser alguien que no se es, animales.",
      "Monstruos, bestias hambrientas, muchos colmillos, garras, fuego, etc."
    ] },
  { q: "Estamos en las temporadas de fiestas de disfraces y altares. Cuando lo invitan a alguna, su reacción es:",
    a: [
      "«Mmmta… qué pereza». Busca excusas y maneras de zafarse.",
      "Busca entre lo que tiene para ver qué armar, quizá pida prestados algunos elementos y ayuda para el maquillaje.",
      "Bloquea varias horas de su agenda, saca el guardadito, compra los elementos para ese disfraz que ha pensado durante meses. Llegó su momento de brillar."
    ] },
  { q: "Si usted fuera un ente que regresa del más allá y se encuentra con el altar, ¿qué es lo primero que toma de ahí?",
    a: [
      "Los cigarros y el alcohol.",
      "Los guisos caseros, las calaveritas, el pancito.",
      "Los objetos personales y de valor: las llaves del coche, los centenarios, las escrituras de la casa."
    ] }
];

/* RESULTADOS: "max" es el puntaje máximo que corresponde a cada uno.
   Con 5 preguntas el total va de 5 a 15:
   hasta 8 = primer resultado, de 9 a 11 = segundo, de 12 a 15 = tercero. */
var RESULTS = [
  { max: 8, level: "Zombi",
    text: "Usted volverá de la posteridad convertido en un monstruoso zombi. Pero no el zombi que se anda despedazando como roast beef de 12 horas de horneado. No, usted es de esos zombis acechantes, letales. Ok, sí, algo embobados, pero pues qué se esperaba de usted: ¿productividad en el más allá? No. Usted aceche a su ritmo." },
  { max: 11, level: "Espectro",
    text: "Usted volverá de la posteridad convertido en un acechante espectro. Usted será esa presencia fantasmal que recorre pasillos en busca de algún incauto o incauta para bajarle el azúcar a fuerza de gritos del más allá o rechinidos de uñas contra el cristal. Lo que sí es que no se limite: a veces arrastre cadenas, luego baje el termostato y en otro momento encienda las luces." },
  { max: 15, level: "Vampiro o vampira",
    text: "Usted volverá de la posteridad convertido en un atemorizante vampiro o vampira. Sí, usted quiere esparcir el evangelio de Nosferatu, pero lo quiere hacer con estilo. No cualquier tipo de miedo: un miedo sofisticado es el que usted provoca. Miedo gourmet. No deje que un triste collar de ajos lo intimide: tápese la nariz y a lo suyo. Eso sí, no olvide usar mucho bloqueador, factor 50 por lo menos." }
];

/* ===== A partir de aquí no hace falta tocar nada ===== */
var LETTERS = ["A", "B", "C"];
var current = 0, points = [];
var $ = function (id) { return document.getElementById(id); };

function show() {
  var item = QUESTIONS[current];
  $("count").textContent = "Pregunta " + (current + 1) + " de " + QUESTIONS.length;
  $("fill").style.width = (current / QUESTIONS.length * 100) + "%";
  $("q").textContent = item.q;
  var list = $("opts");
  list.innerHTML = "";
  item.a.forEach(function (txt, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    var l = document.createElement("span");
    l.className = "letter";
    l.textContent = LETTERS[i];
    var s = document.createElement("span");
    s.textContent = txt;
    b.appendChild(l);
    b.appendChild(s);
    b.addEventListener("click", function () { choose(b, i + 1); });
    li.appendChild(b);
    list.appendChild(li);
  });
}

function choose(btn, value) {
  var all = document.querySelectorAll(".opt");
  for (var i = 0; i < all.length; i++) { all[i].disabled = true; }
  btn.classList.add("sel");
  points.push(value);
  setTimeout(function () {
    current++;
    if (current < QUESTIONS.length) { show(); } else { finish(); }
  }, 350);
}

function finish() {
  var total = points.reduce(function (a, b) { return a + b; }, 0);
  var res = RESULTS.filter(function (r) { return total <= r.max; })[0];
  $("fill").style.width = "100%";
  $("quiz").hidden = true;
  $("level").textContent = res.level;
  $("score").textContent = "Sumó " + total + " puntos de " + (QUESTIONS.length * 3) + ".";
  $("text").textContent = res.text;
  $("result").hidden = false;
    if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path: "monstruos-completado", title: "Test monstruos completado", event: true });
  }
  window.scrollTo(0, 0);
}

$("again").addEventListener("click", function () {
  current = 0; points = [];
  $("result").hidden = true;
  $("quiz").hidden = false;
  show();
});

show();
</script>
</body>
</html>
